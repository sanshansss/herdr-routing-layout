<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
  <title id="title">Magpie Routing v1 Herdr layout</title>
  <desc id="desc">Schematic preview: spaces and agents sidebar, tab bar with a skillshare toggle, terminal area, routing stage panel, and status bar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181d"/>
      <stop offset="1" stop-color="#0e1014"/>
    </linearGradient>
    <style>
      .ui { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Cascadia Mono", Consolas, monospace; }
      .muted { fill: #8b93a1; }
      .dim { fill: #626a78; }
      .text { fill: #e7e9ee; }
      .border { stroke: #2a2f39; }
      .panel { fill: #1b1e24; }
      .raised { fill: #23272f; }
    </style>
  </defs>

  <rect width="720" height="450" rx="10" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="719" height="449" rx="10" fill="none" stroke="#2a2f39"/>

  <!-- Sidebar -->
  <rect x="1" y="1" width="214" height="448" rx="9" fill="#15171c"/>
  <line x1="215" y1="1" x2="215" y2="449" stroke="#2a2f39"/>

  <!-- Brand row -->
  <text class="ui text" x="14" y="29" font-size="13" font-weight="600">Herdr</text>
  <circle cx="196" cy="24" r="7" fill="#23272f" stroke="#2a2f39"/>
  <text class="ui dim" x="193" y="28" font-size="9">+</text>

  <!-- Spaces -->
  <text class="ui dim" x="14" y="53" font-size="10" letter-spacing="0.6">SPACES</text>
  <rect x="8" y="61" width="200" height="24" rx="5" fill="#23272f"/>
  <circle cx="20" cy="73" r="4" fill="#5da9e9"/>
  <text class="ui text" x="31" y="77" font-size="11">workspace</text>
  <text class="ui dim" x="184" y="77" font-size="9">now</text>
  <circle cx="20" cy="100" r="4" fill="#b6bcc8"/>
  <text class="ui muted" x="31" y="104" font-size="11">scratch</text>
  <circle cx="20" cy="124" r="4" fill="#8f7ee8"/>
  <text class="ui muted" x="31" y="128" font-size="11">sandbox</text>

  <!-- Agents -->
  <text class="ui dim" x="14" y="158" font-size="10" letter-spacing="0.6">AGENTS</text>
  <circle cx="20" cy="176" r="4" fill="#59c48b"/>
  <text class="ui muted" x="31" y="180" font-size="11">Claude</text>
  <text class="ui dim" x="185" y="180" font-size="9">idle</text>
  <circle cx="20" cy="198" r="4" fill="#8b93a1"/>
  <text class="ui muted" x="31" y="202" font-size="11">Codex</text>
  <text class="ui dim" x="187" y="202" font-size="9">idle</text>

  <!-- Add frame -->
  <rect x="12" y="219" width="190" height="24" rx="5" fill="none" stroke="#2a2f39" stroke-dasharray="3 3"/>
  <text class="ui dim" x="24" y="235" font-size="10">Add machine or space</text>

  <!-- Sidebar footer -->
  <rect x="12" y="404" width="190" height="1" fill="#2a2f39"/>
  <text class="ui dim" x="14" y="422" font-size="9">this machine</text>
  <text class="ui dim" x="14" y="437" font-size="9">2 spaces · 2 agents</text>

  <!-- Tab bar -->
  <rect x="216" y="1" width="503" height="40" fill="#111318"/>
  <rect x="226" y="10" width="101" height="24" rx="6" fill="#23272f" stroke="#2a2f39"/>
  <circle cx="239" cy="22" r="4" fill="#d97757"/>
  <text class="ui text" x="249" y="26" font-size="11">Agent</text>
  <rect x="334" y="10" width="82" height="24" rx="6" fill="#15171c"/>
  <circle cx="347" cy="22" r="4" fill="#8b93a1"/>
  <text class="ui muted" x="357" y="26" font-size="11">Shell</text>
  <rect x="426" y="10" width="20" height="24" rx="6" fill="#15171c"/>
  <text class="ui dim" x="433" y="26" font-size="12">+</text>

  <!-- skillshare toggle -->
  <rect x="596" y="10" width="111" height="24" rx="7" fill="#1d1a16" stroke="#4a3625"/>
  <circle cx="607" cy="22" r="3.5" fill="#d59a4a"/>
  <text class="ui" x="616" y="26" font-size="10.5" fill="#e3b269">skillshare</text>

  <!-- Work body background -->
  <rect x="224" y="49" width="487" height="365" rx="8" fill="#15171c"/>

  <!-- Terminal card -->
  <rect x="228" y="53" width="300" height="357" rx="8" fill="#101216" stroke="#2a2f39"/>
  <rect x="228" y="53" width="300" height="30" rx="8" fill="#191c22"/>
  <rect x="228" y="73" width="300" height="10" fill="#191c22"/>
  <circle cx="243" cy="68" r="3.5" fill="#59c48b"/>
  <text class="mono text" x="253" y="72" font-size="10">Claude Code — workspace</text>
  <circle cx="513" cy="68" r="4" fill="none" stroke="#2a2f39"/>

  <text class="mono" x="242" y="103" font-size="10" fill="#c7ccd6">$ review the routing panel</text>
  <circle cx="242" cy="121" r="2.5" fill="#59c48b"/>
  <text class="mono" x="250" y="125" font-size="10" fill="#7fd6a4">Read</text>
  <text class="mono muted" x="282" y="125" font-size="10">mods/routing/main.js</text>
  <text class="mono" x="242" y="143" font-size="10" fill="#e7e9ee">The stage draws each completed</text>
  <text class="mono" x="242" y="158" font-size="10" fill="#e7e9ee">route as a short native arc:</text>
  <text class="mono" x="242" y="173" font-size="10" fill="#e7e9ee">agent → magpie → provider.</text>
  <text class="mono dim" x="242" y="199" font-size="10">▸ Checking the empty state</text>
  <rect x="242" y="212" width="173" height="1" fill="#23272f"/>
  <text class="mono dim" x="242" y="229" font-size="10">• routing files are watched</text>
  <text class="mono dim" x="242" y="244" font-size="10">• 25s fallback timer</text>
  <text class="mono" x="242" y="270" font-size="10" fill="#8b93a1">Working…</text>

  <!-- Routing panel -->
  <rect x="537" y="53" width="170" height="357" rx="8" fill="#191c22" stroke="#2a2f39"/>
  <text class="ui text" x="551" y="74" font-size="12" font-weight="600">Routing</text>
  <circle cx="687" cy="70" r="3" fill="#59c48b"/>
  <text class="ui dim" x="551" y="92" font-size="9">live · last 60 routes</text>

  <!-- stage -->
  <rect x="549" y="102" width="146" height="238" rx="8" fill="#121419" stroke="#2a2f39"/>
  <text class="ui dim" x="558" y="119" font-size="8.5" letter-spacing="0.5">STAGE</text>

  <!-- agent nodes -->
  <circle cx="577" cy="143" r="8" fill="#23272f" stroke="#d97757"/>
  <text class="ui dim" x="570" y="163" font-size="8">agent</text>
  <circle cx="577" cy="187" r="8" fill="#23272f" stroke="#6366f1"/>
  <text class="ui dim" x="569" y="207" font-size="8">agent</text>

  <!-- magpie hub -->
  <circle cx="622" cy="249" r="21" fill="#23272f" stroke="#e3b269"/>
  <path d="M614 254c3-7 9-10 16-9-2 6-7 11-13 12l-3-3z" fill="#e3b269" opacity="0.85"/>
  <text class="ui dim" x="605" y="281" font-size="8">magpie</text>

  <!-- providers -->
  <circle cx="669" cy="199" r="8" fill="#23272f" stroke="#5da9e9"/>
  <circle cx="669" cy="236" r="8" fill="#23272f" stroke="#59c48b"/>
  <circle cx="669" cy="273" r="8" fill="#23272f" stroke="#8f7ee8"/>
  <text class="ui dim" x="653" y="292" font-size="8">providers</text>

  <!-- arcs -->
  <path d="M585 148 C 601 168, 603 196, 610 227" fill="none" stroke="#d97757" stroke-width="1.2" opacity="0.85"/>
  <path d="M585 192 C 598 208, 603 222, 608 229" fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.55"/>
  <path d="M641 238 C 651 220, 655 209, 661 204" fill="none" stroke="#5da9e9" stroke-width="1.2" opacity="0.8"/>
  <path d="M642 248 C 651 244, 657 241, 661 238" fill="none" stroke="#59c48b" stroke-width="1.2" opacity="0.7"/>
  <path d="M637 264 C 645 269, 651 271, 661 273" fill="none" stroke="#8f7ee8" stroke-width="1.2" opacity="0.45"/>

  <!-- stage footer -->
  <text class="ui dim" x="558" y="326" font-size="8">waiting for a request</text>

  <!-- routes below stage -->
  <text class="ui dim" x="551" y="364" font-size="8.5" letter-spacing="0.5">RECENT</text>
  <rect x="549" y="372" width="146" height="24" rx="5" fill="#23272f"/>
  <circle cx="560" cy="384" r="3" fill="#59c48b"/>
  <text class="ui muted" x="568" y="387" font-size="9">agent · 200 · 412ms</text>

  <!-- Status bar -->
  <rect x="216" y="422" width="503" height="27" fill="#111318"/>
  <line x1="216" y1="422" x2="719" y2="422" stroke="#2a2f39"/>
  <text class="ui dim" x="226" y="439" font-size="9">2 spaces · 3 agents</text>
  <text class="ui dim" x="337" y="439" font-size="9">skillshare hidden</text>
  <text class="ui dim" x="642" y="439" font-size="9">0 errors</text>
</svg>
